<body>
    <h1>defalt argument</h1>
    <script>
        function getvolume(length,width=1,depth=1)
        {
            console.log(length,width,depth);
            //local variable(only accessible in function)
            let temp=length*width*depth;
            return temp;
        }
        var length=10;
        var width=5;
        var depth=2;
        let volume=getvolume(length,width,depth);
        console.log("volume"+volume);
    </script>
</body>
